<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My goals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shown when nobody is logged in -->
  <section id="auth" class="auth" hidden>
    <div class="auth-card">
      <h1>My goals</h1>
      <p class="muted">Chat with an AI that keeps your goals and todos for you.</p>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Log in</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">Make an account</button>
      </div>

      <form id="auth-form" class="auth-form">
        <label>Name
          <input name="name" type="text" autocomplete="username" required maxlength="40">
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="200">
        </label>
        <label class="signup-only" hidden>Invite code
          <input name="invite" type="password" autocomplete="off">
          <span class="hint">Ask whoever set up the app. It keeps strangers from using the AI.</span>
        </label>
        <p id="auth-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn" id="auth-submit">Log in</button>
      </form>
    </div>
  </section>

  <!-- Shown when logged in -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <h1>My goals</h1>
      <div class="who">
        <span id="who-name" class="muted"></span>
        <button type="button" class="btn ghost small" id="logout">Log out</button>
      </div>
    </header>

    <main class="layout">
      <section class="chat" aria-label="Chat">
        <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
        <form id="chat-form" class="chat-form">
          <input name="text" type="text" aria-label="Your message" placeholder="Try: add a todo for getting groceries" autocomplete="off" maxlength="2000">
          <button name="send" type="submit" class="btn">Send</button>
        </form>
      </section>

      <aside class="lists">
        <section aria-labelledby="todos-title">
          <h2 id="todos-title">Todos</h2>
          <ul id="todo-list" class="todo-list"></ul>
        </section>
        <section aria-labelledby="goals-title">
          <h2 id="goals-title">Goals</h2>
          <ul id="goal-list" class="goal-list"></ul>
        </section>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
